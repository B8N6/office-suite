name: Build release binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Go binary
        working-directory: backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go mod download
          go build -ldflags="-s -w" -o ../b8n6mail-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} .

      - name: Package release archive
        run: |
          NAME="b8n6-office-suite-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "release/$NAME/frontend"
          mkdir -p "release/$NAME/data"
          cp b8n6mail-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} "release/$NAME/b8n6mail${{ matrix.ext }}"
          cp -r frontend/dist/* "release/$NAME/frontend/"
          cp data/config.example.json "release/$NAME/data/"
          cp README.md INSTALL.md CHANGELOG.md LICENSE VERSION "release/$NAME/"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd release && zip -r "$NAME.zip" "$NAME")
            echo "ARTIFACT=release/$NAME.zip" >> $GITHUB_ENV
          else
            (cd release && tar -czf "$NAME.tar.gz" "$NAME")
            echo "ARTIFACT=release/$NAME.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARTIFACT }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          body_path: CHANGELOG.md
