name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy webhook
        env:
          DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
        run: |
          curl --fail --silent --show-error -X POST             -H "X-Deploy-Token: ${DEPLOY_WEBHOOK_TOKEN}"             http://187.77.135.168:9001/deploy
